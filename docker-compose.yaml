name: rbs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbs}
      POSTGRES_USER: ${POSTGRES_USER:-rbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rbs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rbs} -d ${POSTGRES_DB:-rbs}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: rbs-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rbs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rbs}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rbs}
      APP_JWT_SECRET: ${APP_JWT_SECRET:example-secret-key}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-3600000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/gomerion/rbs-front:0.1.0}
    # build: ../rbs-front
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata: