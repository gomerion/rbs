spring:
  application:
    name: rbs
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rbs}
    username: ${SPRING_DATASOURCE_USERNAME:rbs}
    password: ${SPRING_DATASOURCE_PASSWORD:rbs}
    hikari:
      data-source-properties:
        stringtype: unspecified
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 32

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:example-secret-key}
    expiration: ${APP_JWT_EXPIRATION:3600000}
  booking:
    grid-minutes: ${APP_BOOKING_GRID_MINUTES:15}
    min-duration-minutes: ${APP_BOOKING_MIN_DURATION_MINUTES:15}
    max-duration-minutes: ${APP_BOOKING_MAX_DURATION_MINUTES:180}
    advance-days: ${APP_BOOKING_ADVANCE_DAYS:30}
    max-active-employee: ${APP_BOOKING_MAX_ACTIVE_EMPLOYEE:5}
    max-active-manager: ${APP_BOOKING_MAX_ACTIVE_MANAGER:10}
    cancel-hours-employee: ${APP_BOOKING_CANCEL_HOURS_EMPLOYEE:2}
    series-max: ${APP_BOOKING_SERIES_MAX:8}
